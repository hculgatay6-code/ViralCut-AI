name: Windows beta validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['audit/**', 'beta/**']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Prepare verified media tools for tests
        shell: pwsh
        run: ./scripts/prepare-windows-media-tests.ps1
      - name: Install npm dependencies
        shell: pwsh
        run: npm ci
      - name: Install and check Electron for desktop tests
        shell: pwsh
        run: |
          node node_modules/electron/install.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $electron = node -p "require('electron')"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:ELECTRON_RUN_AS_NODE = '1'
          & $electron --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Test
        shell: pwsh
        run: |
          npx playwright install chrome
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test -- --test-concurrency=2

      - name: Verify v21 Effects Studio in Electron
        shell: pwsh
        run: node scripts/verify-v21-effects.mjs
