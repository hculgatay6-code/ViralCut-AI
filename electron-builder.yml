appId: com.viralcut.desktop.v22
productName: ViralCut AI v22
directories:
  output: release
asar: true
npmRebuild: false
files:
  - dist/**
  - desktop/**
  - server/ass.mjs
  - server/caption-design.mjs
  - server/instance.mjs
  - server/export.mjs
  - server/media.mjs
  - server/whisper.mjs
  - server/shorts.mjs
  - server/sequence.mjs
  - server/layers.mjs
  - server/keyframes.mjs
  - server/animation-render.mjs
  - server/effect-document.mjs
  - server/effect-render.mjs
  - server/timeline-document.mjs
  - server/preview.mjs
  - server/proxy-cache.mjs
  - server/shorts-batch.mjs
  - server/shorts-quality.mjs
  - server/effects.mjs
  - server/studio-audio.mjs
  - server/creator.mjs
  - server/analysis-cache.mjs
  - server/resource-budget.mjs
  - server/semantic-*.mjs
  - server/vision-*.mjs
  - server/visual-*.mjs
  - '!node_modules/onnxruntime-node/bin/napi-v6/{linux,darwin}/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'
asarUnpack:
  - server/semantic-worker.mjs
  - server/vision-worker.mjs
  - node_modules/onnxruntime-node/bin/napi-v6/win32/x64/**
extraResources:
  - from: desktop-resources
    to: .
  - from: desktop/icon.ico
    to: icon.ico
  - from: THIRD_PARTY_NOTICES.md
    to: licenses/V22-THIRD_PARTY_NOTICES.md
win:
  icon: desktop/icon.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: ViralCut-AI-v${version}-Setup.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: ViralCut-AI-v${version}-Portable.exe
